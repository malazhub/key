name: Deploy Key to GitHub Pages & Production
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Self-Diagnosis
        run: npm run lint

      - name: Version 8 Self-Tests
        run: >-
          node --import tsx --input-type=module -e "import { run_self_tests } from './src/upgrades/version8Harness.ts'; const r = await run_self_tests(); if (!r.passed) { console.error(JSON.stringify(r)); process.exit(1); } console.log(JSON.stringify({ passed_checks: r.passed_checks, total_checks: r.total_checks }));"

      - name: Build Production Bundle
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
